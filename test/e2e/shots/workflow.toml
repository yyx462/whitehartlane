[workflow]
name = "e2e-shots"
spur_id = "e2e-shots"
worker_kind = "opencode"

[hooks]
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[stage]]
id = "shots"
topology = "solo"
brief = "You will read a file OUTSIDE every root of this run. Permission dialogs will pop up — do NOT answer or cancel them yourself; an external watcher answers within seconds. Step 1: read the file /Users/dev/e2e-shots/shot.png (cat it). Step 2: read the SAME file a second time (cat it again). Step 3: write result.md in your working directory with two lines: first-read: <succeeded|denied> and second-read: <succeeded|denied> and a third line dialogs-seen: <count of dialogs you saw pop up, your best count>."

[report]
where = "units/"
