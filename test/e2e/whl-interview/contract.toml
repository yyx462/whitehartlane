# contract.toml — the ONE source of the interview's law (#200 pilot,
# #205 forced). Everything below is rendered TWICE from this single
# file and nothing else: (1) the generated law section inside each
# member brief (hooks/render_contract.py), (2) the audit's checks
# (hooks/audit.py reads this directly). A brief whose law section does
# not match this file FAILS the audit — hand-edited prose can no
# longer drift from the machine's demands (the attempt-3 disease).

[contract]
name = "whl-interview"

# the fixed topic map — order is law, first-opened must climb it.
# THIS commission's requirement (ad-hoc, the commissioner's
# translation, not a rail law): the question list is AT MOST 5 —
# five topics, one fresh question each, the whole list from the bank.
topics = [
  "admission-jev",
  "pane-supervision",
  "spur-grammar",
  "wakes",
  "accounting",
]

# #205 — guarantee a deliverable on every commission: every artifact
# the wake points at is declared here, with its human-readable kind.
# The audit refuses a run whose deliverable is missing or empty.
# rail-built = produced by the audit itself (transcript), still
# delivered, never demanded of the panes.
[[contract.deliverables]]
name = "pitch"
path = "data/pitch.md"
kind = "md"

[[contract.deliverables]]
name = "topic-map"
path = "data/topic-map.md"
kind = "md"

[[contract.deliverables]]
name = "explained"
path = "data/explained.md"
kind = "md"

[[contract.deliverables]]
name = "gaps"
path = "data/gaps.md"
kind = "md"
# ONE OWNER (run #6 taught: when both minds think the file is theirs,
# the interviewee's freeform shape fails the audit the interviewer's
# format satisfies). The interviewer owns the file; the author only
# answers the rebuttal pass. Shape is law: every gap section ends with
# exactly one line — `rebuttal: stands` or `rebuttal: refuted — <citation>`.
owner = "interviewer"

[[contract.deliverables]]
name = "transcript"
path = "data/transcript.jsonl"
kind = "jsonl"
rail-built = true

[contract.exchange]
turns-per-topic = 2        # a topic stops at solid, 3 gap marks, or this
max-questions = 5          # THIS commission: the whole question list <= 5
rebuttal-turns = 2         # one rebuttal pass (re-asks, not new questions)
ladder = ["What", "How", "Why", "Break", "Boundary"]

[contract.gaps]
must-stand = 1             # zero standing gaps = the interviewer was too soft

[contract.questions]
bank = "data/questions.toml"  # the bank lives on the shared data/ shelf;
                              # every asked question must be banked (or
                              # appended first) in the run's staged copy
append-only = true            # a retired question is marked, never erased

[contract.citations]
# a citation is a repo path, optionally :line — every explained.md
# section carries at least one
pattern = "[A-Za-z0-9_./~-]+\\.(?:ts|mts|mjs|js|md|toml|sh|py)(?::\\d+)?"
