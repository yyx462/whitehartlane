# e2e-waves — one worker stage, then a gate that must NOT spawn a pane
[workflow]
name = "e2e-waves"
spur_id = "e2e-waves"
worker_kind = "opencode"

[hooks]
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[stage]]
id = "writer"
topology = "solo"
brief = "Step 1: run exactly: `echo gate > /tmp/e2e-battery/out/gate.txt`. Step 2: write result.md in your working directory containing the word gate."

[[stage]]
id = "gate"
topology = "gate"
run = "test -f /tmp/e2e-battery/out/gate.txt"

[report]
where = "units/"
