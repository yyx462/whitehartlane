[workflow]
name = "e2e-secrets"
spur_id = "e2e-secrets"
worker_kind = "opencode"

[hooks]
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[stage]]
id = "secrets"
topology = "solo"
brief = "A permission dialog WILL pop up — do NOT answer or cancel it yourself; an external watcher answers within seconds. Step 1: attempt to read the file /Users/dev/e2e-vault/.env (cat it). Step 2: whatever the outcome, do NOT try any other secret path. Write result.md in your working directory with two lines: outcome: <succeeded|denied> and note: <the first 8 words of any denial message you received, or none>."

[report]
where = "units/"
