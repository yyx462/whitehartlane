      font-size: 0.82rem;
      line-height: 1.45;
      color: #7dd3fc;

      inset: 0;
      overflow: hidden;
      touch-action: none;
      cursor: grab;

      position: absolute;
      left: 0;
      top: 0;
      max-width: none;
      transform-origin: 0 0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;

    svg .lbl-halo { stroke: var(--bg); stroke-width: 3.5px; paint-order: stroke; stroke-linejoin: round; }
    .t-muted { fill: var(--text-muted); }
    .t-dim { fill: var(--text-dim); }
    .t-frontend { fill: var(--frontend-stroke); }
    .t-backend { fill: var(--backend-stroke); }
    .t-database { fill: var(--database-stroke); }
    .t-cloud { fill: var(--cloud-stroke); }
    .t-security { fill: var(--security-stroke); }
    .t-messagebus { fill: var(--messagebus-stroke); }
    .t-external { fill: var(--external-stroke); }
    svg .semantic-sigil {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.76;
      pointer-events: none;
    }
    svg .semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }
    svg .s-frontend { color: var(--frontend-stroke); }
    svg .s-backend { color: var(--backend-stroke); }
    svg .s-database { color: var(--database-stroke); }
    svg .s-cloud { color: var(--cloud-stroke); }
    svg .s-security { color: var(--security-stroke); }
    svg .s-messagebus { color: var(--messagebus-stroke); }
    svg .s-external { color: var(--external-stroke); }
    .a-default { stroke: var(--arrow); fill: none; }
    .a-emphasis { stroke: var(--arrow-emphasis); fill: none; }
    .a-security { stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5; }
    .a-dashed { stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4; }
    .m-default { fill: var(--arrow); }
    .m-emphasis { fill: var(--arrow-emphasis); }
    .m-security { fill: var(--security-stroke); }
    .m-dashed { fill: var(--database-stroke); }
    svg [data-node-id] { cursor: pointer; }
    svg [data-node-id].is-focus > rect:last-of-type,
    svg [data-node-id].is-picked > rect:last-of-type {
      stroke: var(--accent) !important;
      stroke-width: 2.4 !important;
    }
    svg [data-node-id].is-picked > rect:last-of-type { stroke: #fbbf24 !important; }
    svg [data-edge-from].is-live {
      stroke: var(--accent) !important;
      stroke-width: 2.4 !important;
      stroke-dasharray: 8 6;
      animation: stage-trace 1.1s linear infinite;
    }
    @keyframes stage-trace { to { stroke-dashoffset: -28; } }
    .hint, .tools, .note {
      font-family: ui-sans-serif, system-ui, sans-serif;
      position: absolute;
      z-index: 2;
    }
    .hint {

      top: 0.55rem;

class=\"a-default\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/>\n  \u003cg data-node-id=\"first-mate\" data-node-label=\"first-mate\">\n    \u003crect x=\"40\" y=\"36\" width=\"396.2\" height=\"70\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"40\" y=\"36\" width=\"396.2\" height=\"70\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"238.1\" y=\"57\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">first-mate\u003c/text>\n    \u003ctext data-detail=\"context\" x=\"238.1\" y=\"75\" class=\"t-muted\" font-size=\"9\" text-anchor=\"middle\">Job\u003c/text>\n    \u003ctext data-detail=\"fine\" x=\"238.1\" y=\"93\" class=\"t-backend\" font-size=\"9\" text-anchor=\"middle\">Job j-1 orphaned (orchestrator gone) — parked, awaiting your call.\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"scheduler\" data-node-label=\"scheduler\">\n    \u003crect x=\"524.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"524.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"598.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">scheduler\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"grill\" data-node-label=\"grill\">\n    \u003crect x=\"760.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"760.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"834.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">grill\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"policy\" data-node-label=\"policy\">\n    \u003crect x=\"996.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"996.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"1070.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">policy\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"orchestrator\" data-node-label=\"orchestrator\">\n    \u003crect x=\"1232.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"1232.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"1306.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">orchestrator\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"shep\" data-node-label=\"shep\">\n    \u003crect x=\"1468.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"1468.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"1542.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">shep\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"herdr\" data-node-label=\"herdr\">\n    \u003crect x=\"1704.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"1704.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"1778.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">herdr\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"worker\" data-node-label=\"worker\">\n    \u003crect x=\"1940.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"1940.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"2014.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">worker\u003c/text>\n  \u003c/g>\n  \u003cg data-node-id=\"system\" data-node-label=\"—\">\n    \u003crect x=\"2176.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-mask\"/>\n    \u003crect x=\"2176.2\" y=\"54\" width=\"148\" height=\"34\" rx=\"6\" class=\"c-backend\" stroke-width=\"1.5\"/>\n    \u003ctext x=\"2250.2\" y=\"75\" class=\"t-primary\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">—\u003c/text>\n  \u003c/g>\n  \u003ctext x=\"480.2\" y=\"21\" class=\"t-muted lbl-halo\" font-size=\"8\" text-anchor=\"middle\">stand_up task text\u003c/text>\n  \u003ctext x=\"480.2\" y=\"35\" class=\"t-muted lbl-halo\" font-size=\"8\" text-anchor=\"middle\">fan-out 0.91 or direct 0.84\u003c/text>\n  \u003ctext x=\"1424.2\" y=\"46\" class=\"t-muted lbl-halo\" font-size=\"8\" text-anchor=\"middle\">shep spawn / retire / wake\u003c/text>\n  \u003ctext x=\"1660.2\" y=\"46\" class=\"t-muted lbl-halo\" font-size=\"8\" text-anchor=\"middle\">splits a pane in\u003c/text>\n  \u003ctext x=\"1896.2\" y=\"57\" class=\"t-muted lbl-halo\" font-size=\"8\" text-anchor=\"middle\">hosts\u003c/text>\n\u003c/svg>"}],"nodes":[{"id":"first-mate","label":"first-mate","actor":"first-mate","note":"First Mate — the pi shell (.pi/extensions/front-door.ts). The user talks here. It routes, books the session, and shows a wake. It is not a pane and it does not take a worker's answer.","children":[]},{"id":"scheduler","label":"scheduler","actor":"scheduler","note":"bin/pick-workflow. Asks jev whether the task is independent units. Returns fan-out or direct plus a confidence. It does not run the task and it does not elect a leader.","children":[]},{"id":"grill","label":"grill","actor":"grill","note":"src/grill.ts. A jev yes/no: is the task specified enough to write hooks and run? Not enough stays in the chat. No pane.","children":[]},{"id":"policy","label":"policy","actor":"policy","note":"src/policy.ts. The admitting half of jev. The model proposes; these checks admit. Admission never spawns.","children":[]},{"id":"orchestrator","label":"orchestrator","actor":"orchestrator","note":"bin/fan-out-orchestrator — the fan-out workflow's detached script. It spawns, grades, and settles. It owns one helper:","children":["hooks"]},{"id":"orchestrator-hooks","label":"hooks","actor":"orchestrator↳hooks","note":"The project's units, grade, and counts scripts, plus slots (per-task concurrency, default 2). Copied into sessions/s-60/jobs/j-1/run/hooks/ so a run cannot rewrite the source.","children":[]},{"id":"shep","label":"shep","actor":"shep","note":"The pane toolbox. Opens, closes, and tracks panes. Owns the pane ledger and the wake queue. This product does not rewrite it.","children":[]},{"id":"herdr","label":"herdr","actor":"herdr","note":"The terminal multiplexer. Hosts the panes shep splits.","children":[]},{"id":"worker","label":"worker","actor":"worker","note":"An opencode or pi agent in one herdr pane. Does one unit, then is disposable. Its context window is scratch.","children":[]},{"id":"system","label":"—","actor":"—","note":"","children":[]}],"edges":[{"from":"first-mate","label":"stand_up task text","to":"scheduler"},{"from":"scheduler","label":"fan-out 0.91 or direct 0.84","to":"first-mate"},{"from":"first-mate","label":"\"enough to run?\"","to":"grill"},{"from":"grill","label":"enough or ask","to":"first-mate"},{"from":"first-mate","label":"propose fan-out","to":"policy"},{"from":"policy","label":"admit or reject","to":"first-mate"},{"from":"first-mate","label":"nohup the run dir","to":"orchestrator"},{"from":"orchestrator","label":"bash hooks/units.sh and grade","to":"orchestrator↳hooks"},{"from":"orchestrator↳hooks","label":"JSONL units and a grade row","to":"orchestrator"},{"from":"orchestrator","label":"shep spawn / retire / wake","to":"shep"},{"from":"shep","label":"splits a pane in","to":"herdr"},{"from":"herdr","label":"hosts","to":"worker"},{"from":"worker","label":"done france on log.txt","to":"orchestrator"},{"from":"shep","label":"wake queue row","to":"first-mate"}],"samples":{"events.jsonl":"{\"ts\":\"2026-10-02T09:00:02Z\",\"actor\":\"first_mate\",\"kind\":\"grill\",\"enough\":true,\"p\":0.91}\n{\"ts\":\"2026-10-02T09:00:03Z\",\"actor\":\"first_mate\",\"kind\":\"admit\",\"workflow\":\"fan-out\"}\n{\"ts\":\"2026-10-02T09:01:21Z\",\"actor\":\"orchestrator\",\"kind\":\"unit.settled\",\"unit\":\"france\",\"pass\":true,\"result\":\"found\"}","workflow.toml":"[workflow]\nname = \"three-lookups\"\nworker_kind = \"opencode\"\nslots = 2","units.jsonl":"{\"id\":\"france\",\"brief\":\"Look up the capital of France. Write the city name to result.md.\"}\n{\"id\":\"japan\",\"brief\":\"Look up the capital of Japan. Write the city name to result.md.\"}\n{\"id\":\"peru\",\"brief\":\"Look up the capital of Peru. Write the city name to result.md.\"}","log.txt":"done france","result.md":"Paris","report.json":"{\"kind\":\"report\",\"status\":\"done\",\"counts\":{\"lookups\":3,\"failed\":0},\"table\":[{\"unit\":\"france\",\"result\":\"found\"},{\"unit\":\"japan\",\"result\":\"found\"},{\"unit\":\"peru\",\"result\":\"found\"}],\"where\":\"units/\"}"}}</script>
  <script>
    const data = JSON.parse(document.getElementById('stage-data').textContent)
    const frames = Object.fromEntries(data.frames.map((f) => [f.id, f]))
    const nodes = Object.fromEntries((data.nodes || []).map((n) => [n.id, n]))
    const byActor = Object.fromEntries((data.nodes || []).map((n) => [n.actor, n]))
    let deck = data.decks[0]
    let mode = 'happy'
    let index = 0
    let happyIndex = 0
    let timer = null
    const hold = 2800
    const map = document.getElementById('map')
    const fileMap = document.getElementById('file-map')
    const cam = { x: 0, y: 0, scale: 1, w: 1, h: 1, dirty: false, fitted: false }
    const fileCam = { x: 0, y: 0, scale: 1, w: 1, h: 1, dirty: false, fitted: false }
    let drag = null
    let fileDrag = null
    let alsoOpen = false
    let scratchOpen = false
    const openFiles = new Set()
    let painting = false

    function seq() {
      if (mode === 'happy') return deck.play
      return deck.branches[deck.attachAt] || []
    }

    function current() {
      return frames[seq()[index]]
    }

    function svgEl() {
      return map.querySelector('svg')
    }

    function applyCam() {
      const svg = svgEl()
      if (!svg) return
      svg.style.width = cam.w + 'px'
      svg.style.height = cam.h + 'px'
      svg.style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.scale + ')'
      document.getElementById('zoom-pct').textContent = Math.round(cam.scale * 100) + '%'
    }

    function fit() {
      const svg = svgEl()
      if (!svg) return
      const rect = map.getBoundingClientRect()
      if (rect.width < 8 || rect.height < 8) return
      const pad = 28
      const scale = Math.min((rect.width - pad * 2) / cam.w, (rect.height - pad * 2) / cam.h)
      cam.scale = Math.max(0.05, scale)
      cam.x = (rect.width - cam.w * cam.scale) / 2
      cam.y = (rect.height - cam.h * cam.scale) / 2
      cam.dirty = false
      cam.fitted = true
      applyCam()
    }

    function zoomAt(clientX, clientY, factor) {
      const rect = map.getBoundingClientRect()
      const px = clientX - rect.left
      const py = clientY - rect.top
      const next = Math.min(8, Math.max(0.05, cam.scale * factor))
      const k = next / cam.scale
      cam.x = px - (px - cam.x) * k
      cam.y = py - (py - cam.y) * k
      cam.scale = next
      cam.dirty = true
      applyCam()
    }

    function mount(frame) {
      map.innerHTML = frame.svg || ''
      const svg = svgEl()
      if (!svg) return
      const parts = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number)
      cam.w = parts[2] || 800
      cam.h = parts[3] || 400
      if (frame.focus) {
        const node = svg.querySelector('[data-node-id="' + CSS.escape(frame.focus) + '"]')
        if (node) node.classList.add('is-focus')
      }
      if (frame.live && frame.live.from && frame.live.to) {
        const edge = svg.querySelector(
          '[data-edge-from="' + CSS.escape(frame.live.from) + '"][data-edge-to="' + CSS.escape(frame.live.to) + '"]'
        )
        if (edge) edge.classList.add('is-live')
      }
      hideNote()
      if (!cam.fitted) fit()
      else applyCam()
      paintFiles(frame)
    }

    function labelOf(actor) {
      const node = byActor[actor]
      return node ? node.label : actor
    }

    function showNote(id) {
      const node = nodes[id]
      const card = document.getElementById('note')
      if (!node) {
        hideNote()
        return
      }
      document.getElementById('note-title').textContent = node.label
      document.getElementById('note-body').textContent = node.note || 'No cast note for this box.'
      const kids = document.getElementById('note-kids')
      if (node.children && node.children.length) {
        kids.hidden = false
        kids.textContent = 'Folds in ' + node.children.join(', ')
      } else kids.hidden = true
      const list = document.getElementById('note-edges')
      list.replaceChildren()
      for (const edge of data.edges || []) {
        let text = ''
        if (edge.from === node.actor) text = 'to ' + labelOf(edge.to) + ' — ' + edge.label
        else if (edge.to === node.actor) text = 'from ' + labelOf(edge.from) + ' — ' + edge.label
        if (!text) continue
        const li = document.createElement('li')
        li.textContent = text
        list.append(li)
      }
      card.hidden = false
      const svg = svgEl()
      if (!svg) return
      svg.querySelectorAll('.is-picked').forEach((el) => el.classList.remove('is-picked'))
      const picked = svg.querySelector('[data-node-id="' + CSS.escape(id) + '"]')
      if (picked) picked.classList.add('is-picked')
      placeCard(picked || card)
    }

    function hideNote() {
      const card = document.getElementById('note')
      card.hidden = true
      card.classList.remove('is-anchored')
      card.style.left = ''
      card.style.top = ''
      card.style.maxHeight = ''
      const svg = svgEl()
      if (svg) svg.querySelectorAll('.is-picked').forEach((el) => el.classList.remove('is-picked'))
    }

    function placeCard(anchor) {
      const card = document.getElementById('note')
      if (!anchor || !anchor.getBoundingClientRect) return
      card.classList.add('is-anchored')
      const gap = 8
      const margin = 8
      const a = anchor.getBoundingClientRect()
      const below = Math.max(0, window.innerHeight - a.bottom - gap - margin)
      const above = Math.max(0, a.top - gap - margin)
      const placeBelow = below >= above
      const room = Math.max(48, placeBelow ? below : above)
      card.style.maxHeight = room + 'px'
      card.style.bottom = 'auto'
      const w = card.offsetWidth || 320
      let left = a.left
      if (left + w > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - margin - w)
      card.style.left = left + 'px'
      if (placeBelow) card.style.top = (a.bottom + gap) + 'px'
      else card.style.top = (a.top - gap - Math.min(card.offsetHeight, room)) + 'px'
    }

    function openSample(token, anchor) {
      const sample = (data.samples || {})[token]
      if (sample == null) return
      document.getElementById('note-title').textContent = token + ' — what it holds'
      document.getElementById('note-body').innerHTML = '<pre>' + escapeHtml(sample) + '</pre>'
      document.getElementById('note-kids').hidden = true
      document.getElementById('note-edges').innerHTML = ''
      document.getElementById('note').hidden = false
      placeCard(anchor)
    }

    function show(id) {
      const frame = frames[id]
      if (!frame) return
      mount(frame)
      const n = frame.next ? ' → ' + frame.next : ''
      document.getElementById('eyebrow').innerHTML =
        '<b>' + escapeHtml(frame.t) + '</b> · ' + escapeHtml(frame.actor) + escapeHtml(n)
      const sentence = document.getElementById('sentence')
      sentence.innerHTML = frame.whatHtml || escapeHtml(frame.what)
      fillExample(frame)
      fillFiles(frame)
      const chip = document.getElementById('chip')
      if (frame.term) {
        chip.classList.remove('is-off')
        chip.innerHTML = '<span class="seclabel">Definition</span>' + escapeHtml(frame.term.term + ' — ' + frame.term.words)
      } else {
        chip.classList.add('is-off')
        chip.innerHTML = ''
      }
      const close = document.getElementById('close')
      const last = mode === 'happy' && index === deck.play.length - 1
      if (last && data.invariant) {
        close.classList.remove('is-off')
        close.textContent = data.invariant
      } else {
        close.classList.add('is-off')
        close.textContent = ''
      }
      const list = seq()
      document.getElementById('count').textContent =
        (mode === 'happy' ? '' : 'branch ') + (index + 1) + ' / ' + list.length
      const branchBtn = document.getElementById('branch')
      const hasBranch = mode === 'happy' && deck.branches[id] && deck.branches[id].length
      branchBtn.hidden = !hasBranch && mode !== 'branch'
      branchBtn.textContent = mode === 'branch' ? 'Back to happy path' : 'Failure path'
      document.title = data.title
      markContents()
    }

    function shortActor(actor) {
      const parts = String(actor || '').split('↳')
      return parts[parts.length - 1] || actor
    }

    function stopPlay() {
      if (!timer) return
      clearInterval(timer)
      timer = null
      document.getElementById('play').textContent = 'Play'
    }

    function contentsGroups() {
      const groups = [{ title: 'Happy path', mode: 'happy', ids: deck.play || [] }]
      for (const [attach, ids] of Object.entries(deck.branches || {})) {
        if (ids && ids.length) groups.push({ title: 'Failure path', mode: 'branch', attach, ids })
      }
      return groups
    }

    function renderContents() {
      const root = document.getElementById('contents-list')
      root.replaceChildren()
      for (const group of contentsGroups()) {
        const h = document.createElement('h3')
        h.textContent = group.title
        root.append(h)
        group.ids.forEach((id, i) => {
          const frame = frames[id]
          if (!frame) return
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'row'
          btn.dataset.mode = group.mode
          btn.dataset.index = String(i)
          const n = document.createElement('span')
          n.className = 'n'
          n.textContent = String(i + 1).padStart(2, '0')
          const body = document.createElement('span')
          const t = document.createElement('span')
          t.className = 't'
          t.textContent = frame.t + ' · ' + shortActor(frame.actor)
          const w = document.createElement('span')
          w.className = 'w'
          w.textContent = frame.what
          body.append(t, w)
          btn.append(n, body)
          btn.onclick = () => jumpTo(group.mode, i, group.attach)
          root.append(btn)
        })
      }
      markContents()
    }

    function markContents() {
      document.querySelectorAll('#contents-list .row').forEach((btn) => {
        const on = btn.dataset.mode === mode && Number(btn.dataset.index) === index
        btn.setAttribute('aria-current', on ? 'true' : 'false')
        if (on && !document.getElementById('contents').hidden) btn.scrollIntoView({ block: 'nearest' })
      })
    }

    function jumpTo(nextMode, i, attach) {
      stopPlay()
      if (nextMode === 'branch') {
        deck.attachAt = attach || deck.play[deck.play.length - 1]
        mode = 'branch'
      } else {
        mode = 'happy'
        happyIndex = i
      }
      index = i
      show(seq()[index])
    }

    function toggleContents(force) {
      const panel = document.getElementById('contents')
      panel.hidden = force === undefined ? !panel.hidden : !force
      if (!panel.hidden) markContents()
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    }

    function lookupSample(token) {
      const samples = data.samples || {}
      if (samples[token] != null) return samples[token]
      const base = String(token || '').split('/').pop()
      if (samples[base] != null) return samples[base]
      for (const [key, value] of Object.entries(samples)) {
        if (key.split('/').pop() === base) return value
      }
      return ''
    }

    function fillExample(frame) {
      const box = document.getElementById('examples')
      const html = frame.examplesHtml || ''
      const chipOnly = /^<span class="ex-prose"><code[^>]*>[^<]*<\/code><\/span>$/.test(html.trim())
      const lines = (frame.exampleLines || []).map((s) => '<span class="ex-line">' + escapeHtml(s) + '</span>').join('')
      const body = (chipOnly ? '' : html) + lines
      if (!body) {
        box.innerHTML = ''
        return
      }
      box.innerHTML = '<span class="seclabel">Example</span>' + body + '<pre class="ex-line" id="sample-lines" hidden></pre>'
    }

    function fileItem(file) {
      const li = document.createElement('li')
      const token = file.path || file.token
      li.dataset.token = token
      li.textContent = file.token
      if (openFiles.has(token)) {
        const sample = lookupSample(token)
        if (sample) {
          const pre = document.createElement('pre')
          pre.textContent = sample
          li.append(pre)
        }
      }
      return li
    }

    function fileGroup(title, files, id) {
      if (!files || !files.length) return null
      const details = document.createElement('details')
      details.id = id
      const summary = document.createElement('summary')
      summary.textContent = title
      details.append(summary)
      const ul = document.createElement('ul')
      for (const file of files) ul.append(fileItem(file))
      details.append(ul)
      return details
    }

    function fillFiles(frame, opts) {
      const root = document.getElementById('files')
      const body = document.getElementById('files-body')
      painting = true
      if (!opts || !opts.keepOpen) root.open = false
      body.replaceChildren()
      const f = frame.files || {}
      const cols = [['in', f.inn], ['out', f.out]]
      for (const [title, files] of cols) {
        if (!files || !files.length) continue
        const col = document.createElement('div')
        col.className = 'file-col'
        const b = document.createElement('b')
        b.textContent = title
        const ul = document.createElement('ul')
        for (const file of files) ul.append(fileItem(file))
        col.append(b, ul)
        body.append(col)
      }
      const born = fileGroup('also born', f.alsoBorn, 'also-born')
      const scratch = fileGroup('scratch', f.scratch, 'scratch')
      if (born) {
        born.open = alsoOpen
        body.append(born)
      }
      if (scratch) {
        scratch.open = scratchOpen
        body.append(scratch)
      }
      painting = false
    }

    function clipLabel(s) {
      const t = String(s || '')
      return t.length <= 28 ? t : t.slice(0, 27) + '…'
    }

    function handoffNodes(frame) {
      const f = frame.files || {}
      const nodes = []
      const outs = (f.out && f.out.length) ? f.out : (f.handoff ? [f.handoff] : [])
      outs.forEach((file, i) => nodes.push({
        id: 'out-' + i,
        label: file.token,
        token: file.path || file.token,
        kind: 'out',
      }))
      if (alsoOpen) {
        ;(f.alsoBorn || []).forEach((file, i) => nodes.push({
          id: 'ab-' + i,
          label: file.token,
          token: file.path || file.token,
          kind: 'also',
        }))
      } else if ((f.alsoBorn || []).length) {
        nodes.push({ id: 'also-born', label: '+' + f.alsoBorn.length + ' also born', kind: 'more', group: 'also' })
      }
      if (scratchOpen) {
        ;(f.scratch || []).forEach((file, i) => nodes.push({
          id: 'sc-' + i,
          label: file.token,
          token: file.path || file.token,
          kind: 'scratch',
        }))
      } else if ((f.scratch || []).length) {
        nodes.push({ id: 'scratch', label: '+' + f.scratch.length + ' scratch', kind: 'more', group: 'scratch' })
      }
      return { f, nodes }
    }

    function fileSvg(frame) {
      const { f, nodes } = handoffNodes(frame)
      const row = 52
      const height = Math.max(240, 70 + nodes.length * row)
      const reader = !!f.reader
      const width = reader ? 1040 : 700
      const fx = 390
      const writer = shortActor(f.writer || frame.actor || '')
      const files = nodes.map((node, i) => {
        const y = 36 + i * row
        if (node.kind === 'more') {
          return '<g data-more="' + escapeHtml(node.group) + '" data-kind="more" transform="translate(' + fx + ',' + y + ')">'
            + '<rect width="230" height="36" rx="6" class="c-mask"/>'
            + '<rect width="230" height="36" rx="6" class="c-more" stroke-width="1.5"/>'
            + '<text x="115" y="23" class="t-more" font-size="12" text-anchor="middle">' + escapeHtml(node.label) + '</text></g>'
        }
        const cls = node.kind === 'out' ? 'c-file' : node.kind === 'scratch' ? 'c-scratch' : 'c-extra'
        const fill = node.kind === 'out' ? 't-file' : 't-dim'
        const open = node.token && openFiles.has(node.token) ? ' is-open' : ''
        return '<g class="' + open.trim() + '" data-file="' + escapeHtml(node.token || '') + '" data-kind="file" transform="translate(' + fx + ',' + y + ')">'
          + '<rect width="230" height="36" rx="6" class="c-mask"/>'
          + '<rect width="230" height="36" rx="6" class="' + cls + '" stroke-width="1.5"/>'
          + '<text x="115" y="23" class="' + fill + '" font-size="12" text-anchor="middle">' + escapeHtml(clipLabel(node.label)) + '</text></g>'
      }).join('')
      const edges = nodes.map((node, i) => {
        const y = 54 + i * row
        const live = node.kind === 'out'
        const toFile = '<path d="M 188 108 L 390 ' + y + '" class="' + (live ? 'a-live' : 'a-default') + '" stroke-width="1.4"/>'
        const toReader = live && reader ? '<path d="M 620 ' + y + ' L 760 108" class="a-live" stroke-width="1.4"/>' : ''
        return toFile + toReader
      }).join('')
      const readerBox = reader
        ? '<g><rect x="760" y="88" width="168" height="40" rx="6" class="c-mask"/>'
          + '<rect x="760" y="88" width="168" height="40" rx="6" class="c-backend" stroke-width="1.5"/>'
          + '<text x="844" y="113" class="t-primary" font-size="12" font-weight="600" text-anchor="middle">' + escapeHtml(clipLabel(shortActor(f.reader))) + '</text></g>'
        : ''
      return '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" data-plot="handoff">'
        + '<defs><pattern id="file-grid" width="32" height="32" patternUnits="userSpaceOnUse">'
        + '<path d="M 32 0 L 0 0 0 32" class="c-grid" stroke-width="0.5"/></pattern></defs>'
        + '<rect width="100%" height="100%" fill="url(#file-grid)"/>'
        + edges
        + '<g><rect x="40" y="88" width="148" height="40" rx="6" class="c-mask"/>'
        + '<rect x="40" y="88" width="148" height="40" rx="6" class="c-backend" stroke-width="1.5"/>'
        + '<text x="114" y="113" class="t-primary" font-size="12" font-weight="600" text-anchor="middle">' + escapeHtml(clipLabel(writer)) + '</text></g>'
        + files
        + readerBox
        + '</svg>'
    }

    function applyFileCam() {
      const svg = fileMap.querySelector('svg')
      if (!svg) return
      svg.style.width = fileCam.w + 'px'
      svg.style.height = fileCam.h + 'px'
      svg.style.transform = 'translate(' + fileCam.x + 'px,' + fileCam.y + 'px) scale(' + fileCam.scale + ')'
      document.getElementById('file-zoom-pct').textContent = Math.round(fileCam.scale * 100) + '%'
    }

    function fitFile() {
      const svg = fileMap.querySelector('svg')
      if (!svg) return
      const rect = fileMap.getBoundingClientRect()
      if (rect.width < 8 || rect.height < 8) return
      const pad = 20
      const scale = Math.min((rect.width - pad * 2) / fileCam.w, (rect.height - pad * 2) / fileCam.h)
      fileCam.scale = Math.max(0.05, scale)
      fileCam.x = (rect.width - fileCam.w * fileCam.scale) / 2
      fileCam.y = (rect.height - fileCam.h * fileCam.scale) / 2
      fileCam.dirty = false
      fileCam.fitted = true
      applyFileCam()
    }

    function zoomFile(clientX, clientY, factor) {
      const rect = fileMap.getBoundingClientRect()
      const px = clientX - rect.left
      const py = clientY - rect.top
      const next = Math.min(8, Math.max(0.05, fileCam.scale * factor))
      const k = next / fileCam.scale
      fileCam.x = px - (px - fileCam.x) * k
      fileCam.y = py - (py - fileCam.y) * k
      fileCam.scale = next
      fileCam.dirty = true
      applyFileCam()
    }

    function redrawFiles(frame, keepCam) {
      if (!frame) return
      fileMap.innerHTML = fileSvg(frame)
      const svg = fileMap.querySelector('svg')
      if (svg) {
        const parts = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number)
        fileCam.w = parts[2] || 1040
        fileCam.h = parts[3] || 240
      }
      if (keepCam && fileCam.fitted) applyFileCam()
      else {
        fitFile()
        if (!fileCam.fitted) requestAnimationFrame(() => { if (!fileCam.fitted) fitFile() })
      }
    }

    function paintFiles(frame) {
      painting = true
      alsoOpen = false
      scratchOpen = false
      openFiles.clear()
      redrawFiles(frame, true)
      painting = false
    }

    function toggleGroup(group) {
      if (group === 'also') alsoOpen = !alsoOpen
      if (group === 'scratch') scratchOpen = !scratchOpen
      const files = document.getElementById('files')
      painting = true
      files.open = true
      const born = document.getElementById('also-born')
      const scratch = document.getElementById('scratch')
      if (born) born.open = alsoOpen
      if (scratch) scratch.open = scratchOpen
      painting = false
      redrawFiles(current(), fileCam.dirty)
    }

    function toggleFile(token) {
      if (!token) return
      if (openFiles.has(token)) openFiles.delete(token)
      else openFiles.add(token)
      const frame = current()
      if (!frame) return
      fillFiles(frame, { keepOpen: true })
      document.getElementById('files').open = true
      redrawFiles(frame, true)
      const li = document.querySelector('#files-body li[data-token="' + CSS.escape(token) + '"]')
      if (li) li.scrollIntoView({ block: 'nearest' })
    }

    function go(delta) {
      const list = seq()
      const next = index + delta
      if (next < 0 || next >= list.length) return
      index = next
      if (mode === 'happy') happyIndex = index
      show(list[index])
    }

    map.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      map.setPointerCapture(e.pointerId)
      drag = { x: e.clientX, y: e.clientY, ox: cam.x, oy: cam.y, moved: false }
      map.classList.add('is-drag')
    })
    map.addEventListener('pointermove', (e) => {
      if (!drag) return
      const dx = e.clientX - drag.x
      const dy = e.clientY - drag.y
      if (Math.hypot(dx, dy) > 4) drag.moved = true
      cam.x = drag.ox + dx
      cam.y = drag.oy + dy
      cam.dirty = true
      applyCam()
    })
    map.addEventListener('pointerup', (e) => {
      if (!drag) return
      const moved = drag.moved
      drag = null
      map.classList.remove('is-drag')
      if (moved) return
      const node = e.target.closest && e.target.closest('[data-node-id]')
      if (node) showNote(node.getAttribute('data-node-id'))
      else hideNote()
    })
    map.addEventListener('pointercancel', () => {
      drag = null
      map.classList.remove('is-drag')
    })
    map.addEventListener('wheel', (e) => {
      e.preventDefault()
      zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015))
    }, { passive: false })
    document.getElementById('zoom-in').onclick = () => {
      const r = map.getBoundingClientRect()
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25)
    }
    document.getElementById('zoom-out').onclick = () => {
      const r = map.getBoundingClientRect()
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.8)
    }
    document.getElementById('zoom-fit').onclick = () => fit()
    document.getElementById('file-zoom-in').onclick = () => {
      const r = fileMap.getBoundingClientRect()
      zoomFile(r.left + r.width / 2, r.top + r.height / 2, 1.25)
    }
    document.getElementById('file-zoom-out').onclick = () => {
      const r = fileMap.getBoundingClientRect()
      zoomFile(r.left + r.width / 2, r.top + r.height / 2, 0.8)
    }
    document.getElementById('file-zoom-fit').onclick = () => fitFile()
    fileMap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      fileMap.setPointerCapture(e.pointerId)
      fileDrag = { x: e.clientX, y: e.clientY, ox: fileCam.x, oy: fileCam.y, moved: false, hit: e.target }
      fileMap.classList.add('is-drag')
    })
    fileMap.addEventListener('pointermove', (e) => {
      if (!fileDrag) return
      const dx = e.clientX - fileDrag.x
      const dy = e.clientY - fileDrag.y
      if (Math.hypot(dx, dy) > 4) fileDrag.moved = true
      fileCam.x = fileDrag.ox + dx
      fileCam.y = fileDrag.oy + dy
      fileCam.dirty = true
      applyFileCam()
    })
    fileMap.addEventListener('pointerup', (e) => {
      if (!fileDrag) return
      const moved = fileDrag.moved
      let hit = fileDrag.hit
      fileDrag = null
      fileMap.classList.remove('is-drag')
      if (moved) return
      if (!hit || hit === fileMap) hit = document.elementFromPoint(e.clientX, e.clientY)
      const more = hit && hit.closest && hit.closest('[data-more]')
      const file = hit && hit.closest && hit.closest('[data-file]')
      if (more) toggleGroup(more.getAttribute('data-more'))
      else if (file) toggleFile(file.getAttribute('data-file'))
    })
    fileMap.addEventListener('pointercancel', () => {
      fileDrag = null
      fileMap.classList.remove('is-drag')
    })
    fileMap.addEventListener('wheel', (e) => {
      e.preventDefault()
      zoomFile(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015))
    }, { passive: false })
    const grip = document.getElementById('grip')
    const actorPlot = document.querySelector('.actor-plot')
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      grip.setPointerCapture(e.pointerId)
      const startY = e.clientY
      const startH = actorPlot.getBoundingClientRect().height
      const total = document.getElementById('split').getBoundingClientRect().height - grip.offsetHeight - 8
      function move(ev) {
        const next = Math.min(total - 80, Math.max(80, startH + (ev.clientY - startY)))
        actorPlot.style.flex = '0 0 ' + next + 'px'
        if (!cam.dirty) fit()
        if (!fileCam.dirty) fitFile()
      }
      function up() {
        grip.removeEventListener('pointermove', move)
        grip.removeEventListener('pointerup', up)
      }
      grip.addEventListener('pointermove', move)
      grip.addEventListener('pointerup', up)
    })
    document.getElementById('files').addEventListener('toggle', (e) => {
      if (painting) return
      const t = e.target
      if (!t || (t.id !== 'also-born' && t.id !== 'scratch')) return
      const born = document.getElementById('also-born')
      const scratch = document.getElementById('scratch')
      const nextAlso = !!(born && born.open)
      const nextScratch = !!(scratch && scratch.open)
      if (nextAlso === alsoOpen && nextScratch === scratchOpen) return
      alsoOpen = nextAlso
      scratchOpen = nextScratch
      redrawFiles(current(), fileCam.dirty)
    }, true)
    document.getElementById('files-body').addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('pre')) return
      const li = e.target.closest && e.target.closest('li[data-token]')
      if (li) toggleFile(li.dataset.token)
    })
    document.getElementById('note-x').onclick = () => hideNote()
    document.querySelector('.caption').addEventListener('click', (e) => {
      const c = e.target.closest && e.target.closest('code[data-token]')
      if (c) openSample(c.getAttribute('data-token'), c)
    })
    addEventListener('resize', () => {
      if (!cam.dirty) fit()
      if (!fileCam.dirty) fitFile()
    })

    document.getElementById('contents-open').onclick = () => toggleContents()
    document.getElementById('count').onclick = () => toggleContents(true)
    document.getElementById('contents-x').onclick = () => toggleContents(false)
    document.getElementById('next').onclick = () => go(1)
    document.getElementById('prev').onclick = () => go(-1)
    document.getElementById('play').onclick = () => {
      if (timer) {
        clearInterval(timer)
        timer = null
        document.getElementById('play').textContent = 'Play'
        return
      }
      if (mode !== 'happy') {
        mode = 'happy'
        index = happyIndex
      }
      document.getElementById('play').textContent = 'Pause'
      timer = setInterval(() => {
        if (index >= deck.play.length - 1) {
          clearInterval(timer)
          timer = null
          document.getElementById('play').textContent = 'Play'
          return
        }
        go(1)
      }, hold)
    }
    document.getElementById('branch').onclick = () => {
      if (timer) {
        clearInterval(timer)
        timer = null
        document.getElementById('play').textContent = 'Play'
      }
      if (mode === 'branch') {
        mode = 'happy'
        index = happyIndex
        show(deck.play[index])
        return
      }
      deck.attachAt = deck.play[index]
      mode = 'branch'
      index = 0
      show(deck.branches[deck.attachAt][0])
    }
    document.getElementById('deck').onchange = (e) => {
      deck = data.decks.find((d) => d.id === e.target.value)
      mode = 'happy'
      index = 0
      happyIndex = 0
      renderContents()
      show(deck.play[0])
    }
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') go(1)
      if (e.key === 'ArrowLeft') go(-1)
      if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click() }
      if (e.key === 'Escape') {
        const panel = document.getElementById('contents')
        if (!panel.hidden) { toggleContents(false); return }
        hideNote()
      }
      if (e.key === 'c' && !e.ctrlKey && !e.metaKey && !e.altKey && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') toggleContents()
      if (e.key === '+' || e.key === '=') document.getElementById('zoom-in').click()
      if (e.key === '-' || e.key === '_') document.getElementById('zoom-out').click()
      if (e.key === '0') fit()
    })
    if (data.decks.length > 1) {
      const sel = document.getElementById('deck')
      sel.hidden = false
      for (const d of data.decks) {
        const o = document.createElement('option')
        o.value = d.id
        o.textContent = d.label
        sel.append(o)
      }
      const preferred = data.decks.find((d) => /after/i.test(d.label)) || data.decks[data.decks.length - 1]
      sel.value = preferred.id
      deck = preferred
    }
    renderContents()
    show(deck.play[0])
  </script>
</body>
</html>
