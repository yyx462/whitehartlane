# the ship contract for THIS repo — read by `whl review` (the gate's
# band) and `gwt submit-pr` (the auto levy). Versioned with the code
# it gates; absent/unparsable = medium + no auto levy.

# every gwt submit-pr levies the review gate right after the PR opens
auto = true

# the levy's model pin (required when auto = true — the lenses must be pinned)
# CHEAPEST FIRST (the owner's ruling, 2026-10-30): the flash model on
# minimax.cn reviews this repo; the paid coding plan is the fallback
# rung, not the default seat.
model = "minimax-cn/MiniMax-M3.1-Flash"

# the band: strict — jev must be 85% sure a lens is pointless to drop
# it, the dropout ladder loosens half as far, and a repeat-offender
# file forces the full rail. This repo is the harness itself; it ships
# the strict posture it sells.
strictness = "strict"

# the owner's stop rule — the diminishing-returns criterion that ends
# a review loop honestly (the 2026-10-31 diagnosis: "zero findings in
# a growing diff" is not a reachable fixed point). Rides the TRUSTED
# side (the BASE commit) exactly like the band: a PR cannot loosen the
# rule that ends its own review. Defaults below are MEASURED against
# this repo's own 11-round history (novel≤1 ×2 consecutive rounds,
# nothing stuck, no P0 — never fires spuriously on the replay).
[stop]
min_rounds = 2   # good faith first — never round 1
rounds = 2       # K: consecutive quiet rounds the criterion demands
novel_max = 1    # N: novel root-cause buckets allowed per round
