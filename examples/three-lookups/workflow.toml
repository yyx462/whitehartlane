# The manifest a project fills: what the workflow is called, which worker
# kind runs the units, and the three hook commands. Hooks run with this
# directory as their working directory. Progress and output live here too.

[workflow]
name = "three-lookups"
worker_kind = "opencode"
slots = 2

[hooks]
units = "bash hooks/units.sh"
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[report]
where = "results/"

[layout]
tab = "new"            # "new" = the fleet gets its own tab; "same" = a column beside your pane
orchestrator = "left"  # which side the orchestrator lane sits on; workers take the other

