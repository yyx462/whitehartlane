# the child: a complete program, runnable standalone. This one is
# deliberately pane-free (units = "true" — nothing to run), so the demo
# shows the nesting mechanics — levy, receipt, wake — without burning
# agents. Put real units or [[step]] tables here and the parent's step
# simply waits for the bigger fixture's full-time.
#   standalone:  agentic-os run child
[workflow]
name = "nested-child"
worker_kind = "opencode"

[hooks]
units = "true"
grade = "true"
counts = "node -p \"JSON.stringify({units: 0})\""

[report]
where = "units/"
