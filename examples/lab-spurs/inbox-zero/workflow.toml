# inbox-zero — an auto-responder. No professor: the world is the wave
# source, you are the veto.
#   run it:     whl run inbox-zero --from <tool>:<session-id>
#               (or --unattended when nobody waits for the wake)
#   drop mail:  put *.ticket files into inbox/ (a data/inbox seed is
#               staged for a first demo run)
#   stop early: touch inbox/STOP
#   your gate:  write inbox/verdict.json — {"approve":true} ships the
#               batch; {"reject":["t<id>"]} requeues those tickets for
#               a redraft. Each verdict is archived once acted on.
[workflow]
name = "inbox-zero"
worker_kind = "opencode"

[hooks]
units = "true"
grade = "node hooks/grade.mjs"
counts = "node hooks/counts.mjs"

[detectors]
signal = "node hooks/inbox.mjs"
end = "node hooks/replied.mjs"

[gates]
await-human = "node hooks/approved.mjs"
