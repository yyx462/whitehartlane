# hand-off — a two-link chain that hands work to a delegated exchange:
# the draft stage's worker writes the note, then the review stage's
# members (check, publish) are minted into a whole CHILD coworker
# program under stages/review/ and levied once — the parent books
# itself as spawner (booked wait — no pane watches the child), and the
# child's wake receipt settles the review link. The retired [[step]]
# wake chain spelled this with three rails and authored child programs
# by hand; the stage grammar is one rail, the children minted.
#   run it:  whl run hand-off --from <tool>:<session-id>
#            (or --unattended when nobody waits for the wake)
[workflow]
name = "hand-off"
worker_kind = "opencode"
slots = 1

[[stage]]
id = "draft"
topology = "solo"
brief = "Wave 1 of hand-off: draft the note the chain will carry down. Write one line DRAFTED to result.md in your working directory (your cwd)."

[[stage]]
id = "review"
topology = "coworker"

[[stage.members]]
name = "check"
initiates = true
brief = "You are check, the reviewer of the exchange. The parent chain drafted a note (the draft stage's deliverable). Write one line CHECKED to result.md in your working directory (your cwd), then message your peer publish: the draft is checked, publish it."

[[stage.members]]
name = "publish"
brief = "You are publish, the signer of the exchange. When the relayed note from check arrives, write one line PUBLISHED to result.md in your working directory (your cwd), then write the stop message with a one-line summary: the note is published."

[report]
where = "units/"
