# review — hop two of the chain: a complete program, runnable
# standalone, that both checks the draft (its own pane) and delegates
# the publishing to a grandchild program. When publish wakes, this
# rail reports done — and ITS wake finishes the parent's review step.
#   standalone:  whl run review --from <tool>:<session-id>
[workflow]
name = "hand-off-review"
worker_kind = "opencode"
slots = 1

[hooks]
units = "true"
grade = "bash hooks/grade.sh"
counts = "node -p \"JSON.stringify({units: 2})\""

[[step]]
id = "check"
finished_by = "end"            # a worker pane runs members/check.md
wave = "w1"

[[step]]
id = "publish"
finished_by = "wake"           # a grandchild rail runs publish/ — no pane
folder = "./publish"
wave = "w2"

[report]
where = "units/"
