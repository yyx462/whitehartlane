# two-signoffs — a deliverable whose quality cannot be measured, only
# approved, twice, by independent authorities on their own clock.
#   run it:  agentic-os run two-signoffs
#   gates:   drop signoffs/security.md and signoffs/legal.md (any
#            order, any time apart) — the report lands only when both
#            exist. A scanner CI job may write one of them.
[workflow]
name = "two-signoffs"
worker_kind = "pi"

[hooks]
units = "true"
grade = "true"
counts = "node hooks/counts.mjs"

[gates]
signoff-legal = "node hooks/legal.mjs"
signoff-security = "node hooks/security.mjs"
