# ui-pause — a coworker program: pause/abort/continue in the window,
# plus the flat Spur Runs list. Two members: backend (GLM-5.3, the
# senior, initiates) extends the server; frontend (GLM-5.3-Flash)
# extends the pages. They talk through the rail.
[workflow]
name = "ui-pause"
spur_id = "ui-pause"
kind = "coworker"
worker_kind = "opencode"

[members.backend]
model = "zai-coding-plan/glm-5.3"
initiates = true

[members.frontend]
model = "zai-coding-plan/glm-5.3-flash"

[hooks]
units = "true"
grade = "true"
counts = "node hooks/counts.mjs"
