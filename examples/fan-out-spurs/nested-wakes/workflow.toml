# nested-wakes — a worker stage, then a delegated exchange the rail mints
# as a WHOLE child program (stages/room/) and levies once at the frontier.
# The child's wake receipt settles the stage: the parent books itself as
# spawner and never spawns a pane for the child's work.
#   run it:  whl run nested-wakes --from <tool>:<session-id>
#            (or --unattended when nobody waits for the wake)
[workflow]
name = "nested-wakes"
worker_kind = "opencode"
slots = 2

[hooks]
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[stage]]
id = "g0"
topology = "solo"
brief = "Wave 1 of nested-wakes: prove the substrate before the child program runs. Write one line READY to result.md in your working directory (your cwd)."

[[stage]]
id = "room"
topology = "coworker"

[[stage.members]]
name = "first"
initiates = true
brief = "You are the first half of the child program. Write one line CHILD-RAN to result.md in your working directory (your cwd), then message your peer second with: ran."

[[stage.members]]
name = "second"
brief = "You are the second half of the child program. When the relayed note from first arrives, reply to first with: acknowledged — then write the stop message with a one-line summary: the child program ran."

[report]
where = "units/"
