# staged-waves — the chain in miniature: a serial first stage, a
# human-file gate, then a parallel wave. The manifest says the whole
# topology; nothing is inferred, no phase files, no relaunch.
#   run it:  whl run staged-waves --from <tool>:<session-id>
#            (or --unattended when nobody waits for the wake)
#   gate:    touch gates/GO when stage 1's work is reviewable
[workflow]
name = "staged-waves"
worker_kind = "opencode"
slots = 2

[hooks]
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[stage]]
id = "g0"
topology = "solo"
brief = "Look up the capital of France. Write the city name to result.md in your working directory (your cwd). One line, nothing else."

[[stage]]
id = "review"
topology = "gate"
run = "test -f gates/GO"

[[stage]]
id = "g1g2"
topology = "fan-out"
units = [
  { id = "g1", brief = "Look up the capital of Japan. Write the city name to result.md in your working directory (your cwd). One line, nothing else." },
  { id = "g2", brief = "Look up the capital of Peru. Write the city name to result.md in your working directory (your cwd). One line, nothing else." },
]

[report]
where = "units/"
