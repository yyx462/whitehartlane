# dag-purge (continued) — reorg wave landed on spur-word (63539c3,
# cherry-picked here); this run finishes the job: the dictionary/ADR/
# skill wave, the code rename, then verify.
#   run it:  whl run agentic-program/dag-purge --from opencode:<sid>
[workflow]
name = "dag-purge"
dag_id = "dag-purge"          # legacy key spelling until ADR 0009 lands
worker_kind = "opencode"
slots = 2

[hooks]
units = "true"                # steps define the units (ADR 0007)
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[step]]
id = "adr-dictionary"
finished_by = "end"           # a worker pane runs members/adr-dictionary.md
wave = "w1"

[[step]]
id = "rename-code"
finished_by = "end"           # a worker pane runs members/rename-code.md
wave = "w2"

[[step]]
id = "verify"
finished_by = "end"           # a worker pane runs members/verify.md
wave = "w3"

[report]
where = "units/"
