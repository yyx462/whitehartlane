# dag-purge — retire the word "dag" from agentic-os: the dictionary
# says the word is "spur" everywhere a human reads; this program makes
# it true of the format too (spur.mjs, spur_id) and reorganizes the
# examples into lab-spurs/ fan-out-spurs/ coworker-spurs/.
# Wave grammar per ADR 0007: w1 two parallel workers (disjoint file
# ownership), w2 a sync check beside the code rename, w3 verify.
#   run it:  whl run agentic-program/dag-purge --from opencode:<sid>
[workflow]
name = "dag-purge"
dag_id = "dag-purge"          # legacy key spelling until ADR 0009 lands
worker_kind = "opencode"
slots = 2

[hooks]
units = "true"                # steps define the units (ADR 0007)
grade = "bash hooks/grade.sh"
counts = "bash hooks/counts.sh"

[[step]]
id = "reorg-examples"
finished_by = "end"           # a worker pane runs members/reorg-examples.md
wave = "w1"

[[step]]
id = "adr-dictionary"
finished_by = "end"           # a worker pane runs members/adr-dictionary.md
wave = "w1"

[[step]]
id = "reorg-landed"
finished_by = "check"         # nothing works — the three folders exist
check = "test ! -d examples/agentic-program && test -d examples/lab-spurs && test -d examples/fan-out-spurs && test -d examples/coworker-spurs"
wave = "w2"

[[step]]
id = "rename-code"
finished_by = "end"           # a worker pane runs members/rename-code.md
wave = "w2"

[[step]]
id = "verify"
finished_by = "end"           # a worker pane runs members/verify.md
wave = "w3"

[report]
where = "units/"
