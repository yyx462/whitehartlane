<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>whitehartlane · spurs</title>
    <script>
      // theme before first paint — no flash of wrong theme
      (function () {
        try {
          var t = localStorage.getItem("whl-theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* stay dark */ }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topnav">
      <a class="brand" href="#/home">
        <span class="brand-dot"></span>
        <span class="wordmark">whitehartlane</span>
        <span class="brand-sub">spurs</span>
      </a>
      <nav class="mainnav">
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/spurs" data-nav="spurs">Spurs</a>
      </nav>
      <nav class="subnav" id="subnav" aria-label="Spurs section">
        <a href="#/spurs" data-subnav="spurs">Spurs</a>
        <span class="subnav-sep">·</span>
        <a href="#/spur-status" data-subnav="spur-status">Spur Status</a>
        <span class="subnav-sep">·</span>
        <a href="#/spur-runs" data-subnav="spur-runs">Spur Runs</a>
      </nav>
      <div class="nav-right">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme">Dark</button>
        <span id="refresh-note" class="muted" title="auto-refresh interval">5s</span>
        <span id="clock" class="muted mono"></span>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
